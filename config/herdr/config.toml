onboarding = false

[keys]
prefix = "ctrl+b"
detach = "prefix+q"
new_tab = "prefix+t"
close_tab = "prefix+w"
rename_tab = "prefix+,"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
split_vertical = "prefix+r"
split_horizontal = "prefix+d"
last_pane = "prefix+;"
close_pane = "prefix+x"
copy_mode = "prefix+["
reload_config = "prefix+shift+r"
resize_mode = "prefix+s"
zoom = "prefix+z"
focus_pane_up = "prefix+k"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[theme]
# Dark Modern相当のプリセットが無いため、方針どおりcatppuccinに統一
name = "terminal"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[session]
resume_agents_on_restore = true

# git-wtは `../{gitroot}-worktrees` の隣接方式だが、herdrは
# `<directory>/<repo>/<branch-slug>` の固定ルート方式しか取れない。
# 名前を分けて、どちらが作ったチェックアウトか判別できるようにする。
[worktrees]
directory = "~/workspace/herdr-worktrees"

[ui]
pane_gaps = false
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "spaces"
# 既定の26だとブランチ名やタスク要約が全角13文字で切れる。上限36の手前まで広げる。
sidebar_width = 34

# workspaceをリポジトリ単位に分けると、ここにプロジェクトとブランチが出る。
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "agent"], ["workspace", "tab"]]

# workspaceを分けるまでの暫定。今はspaceが1つしかなくbranch行が出ないため、
# terminal_titleを外すとtabの自動採番番号しか識別子が残らない。
# 分割後はこのテーブルごと消してrowsに寄せる。
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false
